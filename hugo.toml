baseURL = "https://go-fde.github.io/"
title = "go-fde"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[markup.goldmark.renderer]
  unsafe = true

# Each repo card. "blurb" is the honest one-line summary drawn from the
# repo's own README. "role" = the format it handles. Every module is a
# pure-Go library; there are no CLIs yet, so no "cli" type is used.
[[params.repos]]
  name = "fde"
  role = "dispatcher"
  blurb = "Unified Device interface that dispatches over the LUKS, APFS, BitLocker, VeraCrypt and plaintext backends, with header auto-detection (Detect / Open with fde.Auto) for all but VeraCrypt, whose header is ciphertext and which is opened by name. Layers on any io.ReaderAt + WriteAt + Closer, so it composes over backends like QCOW2."
[[params.repos]]
  name = "luks"
  role = "LUKS 1/2"
  blurb = "Read/write support for LUKS1 and LUKS2 containers: phdr and binary-superblock + JSON metadata parsing, PBKDF2 key derivation, anti-forensic split/merge, and the aes-xts-plain64 and aes-cbc-essiv:sha256 ciphers. Rarer ciphers (twofish/serpent) and hashes (sha3, blake2b) are out of scope."
[[params.repos]]
  name = "apfs"
  role = "FileVault 2"
  blurb = "Read/write support for APFS FileVault 2: the PBKDF2-SHA256 KEK, AES-KW (RFC 3394) key-bag unwrapping of the volume key, and AES-XTS per-512-byte-sector block encryption."
[[params.repos]]
  name = "bitlocker"
  role = "BitLocker"
  blurb = "Read-only BitLocker (Windows 7+, To Go): unlock by password, recovery password, .BEK startup key or clear key; AES-CBC with and without the Elephant diffuser and AES-XTS, 512-byte and 4 KiB sectors. The decrypted volume matches cryptsetup's bitlkOpen byte for byte on 21 Windows-made images."
[[params.repos]]
  name = "veracrypt"
  role = "VeraCrypt"
  blurb = "Read-only VeraCrypt and TrueCrypt: every XTS cipher and cascade VeraCrypt offers (AES, Camellia, Kuznyechik, Serpent, Twofish and ten cascades); every KDF cryptsetup's tcrypt tries (PBKDF2 with SHA-512, SHA-256, BLAKE2s, RIPEMD-160, Whirlpool or Streebog-512, and Argon2id, plus the SHA-256, BLAKE2s and RIPEMD-160 boot rows for system encryption; the Streebog boot row is not supported); PIM, keyfiles, hidden volumes, backup headers and system encryption (an encrypted boot drive or system partition, not a hidden operating system). Opens all 65 XTS volumes of cryptsetup's VeraCrypt and TrueCrypt corpus; the 28 LRW and CBC ones are refused."
[[params.repos]]
  name = "zed"
  role = "ZED! archives"
  blurb = "Read-only Prim'X ZED! .zed archives for password users: MS-CFB container, PKCS#12 key derivation (SHA-1 and SHA-256), AES-CBC in the STREAM and CTS modes, zlib. Every test vector of the 2017 format document passes, and a ZED! Free 2024.4 container (a folder and a PNG) extracts byte for byte against the original, including the per-file IV of 0200 archives. RSA users and writing are not supported."
[[params.repos]]
  name = "clear"
  role = "passthrough"
  blurb = "A plaintext Device that forwards all I/O straight to the underlying file or block device with no encryption, satisfying the same interface as the luks and apfs backends so fde can treat plaintext devices uniformly."

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 4.88:1, bright on the dark background 9.94:1.
  base = "#0079a8"
  deep = "#004a66"
  bright = "#22cce2"
  shadow = "rgba(0,121,168,.7)"
  glow = "rgba(0,121,168,.6)"
  wash = "rgba(0,121,168,.10)"
  washDeep = "rgba(0,74,102,.06)"
  chipBg = "#e4f9fc"
  chipBorder = "#bdf0f6"
  chipFg = "#004a66"
  chipBgDark = "rgba(34,204,226,.14)"
  chipBorderDark = "rgba(34,204,226,.32)"
  chipFgDark = "#85e3ef"
  statsEnd = "#caf3f8"
  bandText = "#dcf7fa"
